name: Publicar copia independiente

on:
  push:
    branches: [main]
    paths:
      - 'standalone/**'
      - '.github/workflows/deploy-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: standalone
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
