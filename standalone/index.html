<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EditFlow Pro · prototipo Claude</title>
<style>
:root{--bg:#f6f5f2;--pn:#fff;--tx:#1c1b19;--mu:#6b675f;--bd:#e3e0d8;--ac:#b4561f;--ac2:#fbe9dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--pn:#1e1d1a;--tx:#f0ede6;--mu:#a09b90;--bd:#33312c;--ac:#e8895a;--ac2:#3a2519;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141311;--pn:#1e1d1a;--tx:#f0ede6;--mu:#a09b90;--bd:#33312c;--ac:#e8895a;--ac2:#3a2519;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}.side{width:220px;flex:none;background:var(--pn);border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:700;font-size:17px;padding:4px 8px 12px}.logo b{color:var(--ac)}
.nv{all:unset;cursor:pointer;padding:9px 10px;border-radius:9px;color:var(--mu);display:flex;gap:10px}.nv:hover{background:var(--bg)}.nv.on{background:var(--ac2);color:var(--ac);font-weight:600}
.foot{margin-top:auto;font-size:12px;color:var(--mu);padding:8px}
.main{flex:1;min-width:0;padding:20px 24px 40px}.ban{background:var(--ac2);color:var(--ac);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px}.sub{color:var(--mu);margin:0 0 16px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:16px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.btn{all:unset;cursor:pointer;border:1px solid var(--bd);background:var(--pn);padding:7px 13px;border-radius:9px;font-size:14px}.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.chip.on{background:var(--ac2);color:var(--ac);border-color:var(--ac)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;flex:1;min-width:120px}.bar i{display:block;height:100%;background:var(--ac)}
.im{position:relative;overflow:hidden;width:100%;height:100%}.im.abs{position:absolute;inset:0}.im img{width:100%;height:100%;object-fit:cover;display:block}.im i{position:absolute;inset:0;mix-blend-mode:soft-light;pointer-events:none}
.th{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--bd)}.th.act{border-color:var(--ac)}.th.sel{box-shadow:0 0 0 2px var(--ac)}
.tb{position:absolute;top:4px;display:flex;gap:4px;left:4px;right:4px;justify-content:space-between}.tb button{all:unset;cursor:pointer;background:rgba(0,0,0,.55);color:#fff;border-radius:7px;padding:1px 7px;font-size:13px}
.nm{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:11px;padding:10px 6px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}.cmp{position:relative;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:var(--bd)}
.ln{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 4px #0008}.lb{position:absolute;top:8px;background:#000a;color:#fff;font-size:12px;padding:2px 8px;border-radius:6px}
.sl{display:block;margin-bottom:12px;font-size:13px}.sl span{display:flex;justify-content:space-between}.sl input{width:100%;accent-color:var(--ac)}
.strip{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px}.strip .th{width:96px;flex:none}
.pg{aspect-ratio:2/1;display:grid;gap:6px;padding:6px;background:#fff;border-radius:6px;border:2px solid var(--bd);box-shadow:0 2px 8px #0002}.pg.cur{border-color:var(--ac)}
.sk{position:relative;background:#eee;border-radius:3px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px}.sk.tg{outline:3px solid var(--ac);outline-offset:-3px}
.sk button{all:unset;cursor:pointer;position:absolute;top:3px;right:3px;background:#000a;color:#fff;border-radius:6px;padding:0 6px;font-size:12px;z-index:2}
.emp{text-align:center;padding:48px 16px;border:2px dashed var(--bd);border-radius:14px;color:var(--mu)}
input[type=text],textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}textarea{font:12px/1.4 ui-monospace,monospace;min-height:220px}
table{width:100%;border-collapse:collapse}td{padding:6px 0;border-bottom:1px solid var(--bd)}td+td{text-align:right;font-weight:600}
@media(max-width:760px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd)}.logo,.foot{display:none}.nv{white-space:nowrap}.main{padding:14px}.ed{grid-template-columns:1fr}}

.bar.thin{height:6px}.sv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:12px}.sv button{all:unset;cursor:pointer;text-decoration:underline}

.im.ph{display:flex;align-items:center;justify-content:center;background:var(--bd);color:var(--mu);font-size:11px;text-align:center;padding:4px;min-height:40px}
</style></head><body><div id="root"></div>
